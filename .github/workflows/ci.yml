name: Frontend CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The codebase still has pre-existing ESLint errors; report them without failing the build
      # until they are cleaned up, then remove continue-on-error.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
